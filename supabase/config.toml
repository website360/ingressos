project_id = "ingressos"

[api]
enabled = true
port = 54321
# `private` NUNCA é exposto. `api` é a fachada de RPCs; `audit` é somente leitura.
schemas = ["public", "api", "audit", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "100MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false                # criação de conta só por convite (RF-02.2)
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true        # troca de e-mail exige confirmação dupla (RF-02.4)
enable_confirmations = true
secure_password_change = true
max_frequency = "20s"

[auth.mfa]
max_enrolled_factors = 3

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.sessions]
timebox = "24h"
inactivity_timeout = "8h"

# Injeta tenant ativo e permissões no JWT (ADR-004).
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/private/custom_access_token_hook"

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false
