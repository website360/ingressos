name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY_LOCAL || 'local-anon-key' }}
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  quality:
    name: Lint, tipos e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Build
        run: npm run build

# O job "Migrations e RLS" foi removido aqui.
#
# Ele subia um Supabase local em contêiner (`supabase start`) para aplicar as
# migrations do zero, rodar os testes pgTAP de RLS e conferir os tipos gerados.
# Nunca funcionou: nos 14 runs que existiram, os 14 falharam no primeiro passo,
# `supabase start`, e os testes pgTAP jamais chegaram a executar. O saldo era
# dois minutos por push e uma CI vermelha permanente, sem nenhuma verificação
# em troca.
#
# Apontá-lo para o banco real não era alternativa: o passo seguinte era
# `supabase db reset`, que apaga e recria o banco inteiro.
#
# As migrations continuam sendo aplicadas sob comando, com `npm run db:push`
# (scripts/remote.mjs) — que é como o schema em produção chegou onde está.
#
# Para trazer o job de volta, é preciso antes descobrir por que o
# `supabase start` falha no runner. O histórico está no git.
