# =============================================================================
# Nginx — proxy reverso para o Next.js standalone (docs/08, seção 2).
#
# Ao apontar um domínio novo, acrescente-o ao `server_name` do segundo bloco
# ANTES de rodar o certbot — o host que não estiver listado é descartado.
# =============================================================================

upstream ingressos {
  server 127.0.0.1:3000;
  keepalive 32;
}

# Host desconhecido morre aqui, sem resposta (444 fecha a conexão).
#
# Não é firula: o middleware da aplicação monta o redirect de login a partir do
# cabeçalho `Host`, porque atrás de proxy o Next devolve localhost:3000. Aceitar
# qualquer Host transformaria isso em redirect aberto — bastaria alguém pedir
# /dashboard com `Host: site-falso.com` para receber um Location apontando para
# lá. Com a lista fechada, o cabeçalho passa a ser confiável.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  listen [::]:80;
  server_name ingressos.agenciamay.com.br 67.207.88.20;

  # O upload de banner do evento vai a 10 MB (serverActions.bodySizeLimit no
  # next.config.ts). Sem esta linha o Nginx corta em 1 MB e devolve 413 antes
  # de a aplicação chegar a validar o arquivo.
  client_max_body_size 12M;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Estáticos com hash no nome: imutáveis, cache longo.
  location /_next/static/ {
    proxy_pass http://ingressos;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /_next/image/ {
    proxy_pass http://ingressos;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    proxy_pass http://ingressos;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;

    # ATENÇÃO (docs/08): o IP registrado na auditoria de check-in e usado no
    # rate limit vem daqui. Sem estes três cabeçalhos, todo check-in fica
    # gravado com 127.0.0.1 e a auditoria não serve para nada.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
  }
}
