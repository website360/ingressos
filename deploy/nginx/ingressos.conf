# =============================================================================
# Nginx — proxy reverso para o Next.js standalone (docs/08, seção 2).
#
# Troque `server_name` pelo domínio antes de rodar o certbot. Enquanto for só
# o IP do droplet, `_` atende qualquer host.
# =============================================================================

upstream ingressos {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name _;

  # O upload de banner do evento vai a 10 MB (serverActions.bodySizeLimit no
  # next.config.ts). Sem esta linha o Nginx corta em 1 MB e devolve 413 antes
  # de a aplicação chegar a validar o arquivo.
  client_max_body_size 12M;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Estáticos com hash no nome: imutáveis, cache longo.
  location /_next/static/ {
    proxy_pass http://ingressos;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /_next/image/ {
    proxy_pass http://ingressos;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    proxy_pass http://ingressos;
    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;

    # ATENÇÃO (docs/08): o IP registrado na auditoria de check-in e usado no
    # rate limit vem daqui. Sem estes três cabeçalhos, todo check-in fica
    # gravado com 127.0.0.1 e a auditoria não serve para nada.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 60s;
  }
}
